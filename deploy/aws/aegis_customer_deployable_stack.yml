AWSTemplateFormatVersion: '2010-09-09'
Description: 'AEGIS Customer-Deployable Autonomous DevSecOps Engineer - In-Account Serverless Stack'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'prod'
    Description: 'Deployment tier (e.g. prod, staging, dev)'

  BedrockModelId:
    Type: String
    Default: 'anthropic.claude-haiku-4-5-20251001-v1:0'
    AllowedValues:
      - 'anthropic.claude-haiku-4-5-20251001-v1:0'
      - 'anthropic.claude-3-5-sonnet-20241022-v2:0'
      - 'anthropic.claude-3-haiku-20240307-v1:0'
    Description: 'Amazon Bedrock foundation model ID for reasoning and patch synthesis'

  ContextCompletenessThreshold:
    Type: Number
    Default: 0.85
    MinValue: 0.50
    MaxValue: 1.00
    Description: 'Minimum telemetry completeness score required before certifying verdicts (Default: 0.85)'

Resources:
  # =========================================================================
  # 1. SCOPED LEAST-PRIVILEGE READ-ONLY IAM ROLE
  # =========================================================================
  AegisScopedInspectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'aegis-scoped-inspector-role-${EnvironmentName}'
      Description: 'Strictly scoped read-only discovery and analysis role for AEGIS Autonomous DevSecOps Engineer'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AegisExplicitApiAllowlist
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # A. Explicit Read-Only Compute & Network Metadata Discovery
              - Sid: ExplicitNetworkAndComputeDiscovery
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceAttribute
                Resource: '*'

              # B. Explicit Read-Only IAM Role & Policy Structural Metadata
              - Sid: ExplicitIamStructuralInspection
                Effect: Allow
                Action:
                  - iam:ListRoles
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListInstanceProfiles
                Resource: '*'

              # C. Explicit Read-Only Storage Configuration Metadata (NO GetObject!)
              - Sid: ExplicitS3MetadataOnlyInspection
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketAcl
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketTagging
                Resource: '*'

              # D. Explicit Read-Only Database & Forensics Metadata
              - Sid: ExplicitRdsAndCloudTrailForensics
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSubnetGroups
                  - cloudtrail:LookupEvents
                  - securityhub:GetFindings
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                Resource: '*'

              # E. In-Region Amazon Bedrock Model Invocation
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub 'arn:aws:bedrock:*::foundation-model/${BedrockModelId}'

  # =========================================================================
  # 2. CUSTOMER-OWNED S3 BUCKET FOR WEB CONSOLE & ARTIFACTS
  # =========================================================================
  AegisCustomerWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aegis-customer-console-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSnapshots
            Status: Enabled
            Prefix: snapshots/
            ExpirationInDays: 30

  # =========================================================================
  # 3. CLOUDFRONT ORIGIN ACCESS CONTROL (OAC)
  # =========================================================================
  AegisCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'aegis-customer-oac-${EnvironmentName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # =========================================================================
  # 4. CLOUDFRONT CDN DISTRIBUTION FOR PRIVATE WEB CONSOLE
  # =========================================================================
  AegisConsoleCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: 'AEGIS In-Account Autonomous DevSecOps Web Console'
        Origins:
          - Id: AegisConsoleS3Origin
            DomainName: !GetAtt AegisCustomerWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AegisCloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: AegisConsoleS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # =========================================================================
  # 5. S3 BUCKET POLICY ALLOWING CLOUDFRONT OAC READ ACCESS
  # =========================================================================
  AegisBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AegisCustomerWebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AegisCustomerWebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AegisConsoleCDN.Id}'

  # =========================================================================
  # 6. IN-ACCOUNT SERVERLESS AGENT BACKEND (AWS LAMBDA)
  # =========================================================================
  AegisServerlessBackendLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'aegis-devsecops-engine-${EnvironmentName}'
      Description: 'In-Account AEGIS DevSecOps Autonomous Investigation Engine'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AegisScopedInspectorRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          AEGIS_TARGET_ACCOUNT_ID: !Ref 'AWS::AccountId'
          AEGIS_DEFAULT_REGION: !Ref 'AWS::Region'
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          COMPLETENESS_THRESHOLD: !Ref ContextCompletenessThreshold
          AEGIS_READ_ONLY_ENFORCEMENT: 'true'
      Code:
        ZipFile: |
          import json
          import os

          def handler(event, context):
              account_id = os.environ.get("AEGIS_TARGET_ACCOUNT_ID", "unknown")
              region = os.environ.get("AEGIS_DEFAULT_REGION", "us-east-1")
              model_id = os.environ.get("BEDROCK_MODEL_ID", "anthropic.claude-haiku-4-5-20251001-v1:0")

              path = event.get("rawPath", event.get("path", "/"))
              method = event.get("requestContext", {}).get("http", {}).get("method", event.get("httpMethod", "GET"))

              # Default Health & Identity Response
              response_data = {
                  "status": "healthy",
                  "service": "AEGIS In-Account DevSecOps Engineer",
                  "account_id": account_id,
                  "region": region,
                  "bedrock_model": model_id,
                  "mode": "read_only_investigation",
                  "enforced_rules": 15,
                  "path_requested": path
              }

              return {
                  "statusCode": 200,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*",
                      "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
                      "Access-Control-Allow-Headers": "Content-Type,Authorization"
                  },
                  "body": json.dumps(response_data)
              }

  # =========================================================================
  # 7. LAMBDA FUNCTION URL (DIRECT HTTPS REST ENDPOINT)
  # =========================================================================
  AegisLambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt AegisServerlessBackendLambda.Arn
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 3600

  AegisLambdaFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AegisServerlessBackendLambda
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  WebConsoleURL:
    Description: 'Customer-Owned Private AEGIS Web Console URL'
    Value: !Sub 'https://${AegisConsoleCDN.DomainName}'

  BackendApiUrl:
    Description: 'In-Account Serverless AEGIS Engine HTTPS Endpoint'
    Value: !GetAtt AegisLambdaFunctionUrl.FunctionUrl

  ScopedInspectorRoleArn:
    Description: 'Read-Only Scoped Inspector IAM Role ARN'
    Value: !GetAtt AegisScopedInspectorRole.Arn

  TargetAccountId:
    Description: 'Customer AWS Account ID hosting the AEGIS deployment'
    Value: !Ref 'AWS::AccountId'

  ConfiguredBedrockModel:
    Description: 'Amazon Bedrock Model configured for agent reasoning'
    Value: !Ref BedrockModelId

  S3StorageBucket:
    Description: 'Customer S3 Bucket for Console Assets and Snapshots'
    Value: !Ref AegisCustomerWebBucket
