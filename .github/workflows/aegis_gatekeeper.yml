name: "AEGIS Security & DevSecOps Gatekeeper"

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  aegis-security-audit:
    name: "Evaluate Cloud Perimeter & Attack Paths"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install AEGIS Engine Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run AEGIS Gatekeeper Scan"
        id: aegis_scan
        run: |
          python -m cli.aegis_cli \
            --terraform-plan fixtures/terraform_plans/risky_ssh_exposure.json \
            --format markdown \
            --output aegis_report.md \
            --fail-on-block || echo "SCAN_FAILED=true" >> $GITHUB_ENV

      - name: "Post AEGIS PR Review Comment"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('aegis_report.md')) {
              const body = fs.readFileSync('aegis_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: "Enforce Verdict Gate"
        if: env.SCAN_FAILED == 'true'
        run: |
          echo "::error::AEGIS Gatekeeper blocked merge due to critical perimeter violation or incomplete context."
          exit 1
